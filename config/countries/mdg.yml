# MakyClimat — configuration pays : Madagascar (pays pilote)
# Pour ajouter un pays : copier ce fichier (ex. ken.yml), adapter, puis lancer les scripts avec --country ken
iso3: MDG
slug: mdg
name: Madagascar
language: fr

map:
  bbox: [43.0, -26.0, 51.0, -11.5]   # lon_min, lat_min, lon_max, lat_max
  center: [-19.4, 46.7]              # lat, lon
  zoom: 6

levels:
  1: {label: Région,    plural: Régions}
  2: {label: District,  plural: Districts}
  3: {label: Commune,   plural: Communes}
  4: {label: Fokontany, plural: Fokontany}

# --- Sources de limites et de population (HDX / OCHA, gratuites) ---
boundaries:
  hdx_dataset: cod-ab-mdg
population:
  hdx_dataset: cod-ps-mdg
  reference_year: 2018
  # Option précision : grille WorldPop 100 m (voir README, workflow « Limites et population »)
  grid_hdx_dataset: c4591e47-f0fd-4dbd-81a0-6504f97e8f56
  grid_year: 2025

# --- Pluie satellitaire CHIRPS (CHC / UCSB, gratuite) ---
rainfall:
  monthly_url: "https://data.chc.ucsb.edu/products/CHIRPS/v2.0/africa_monthly/tifs/chirps-v2.0.{y}.{m:02d}.tif.gz"
  dekad_url:   "https://data.chc.ucsb.edu/products/CHIRPS/v2.0/africa_dekad/tifs/chirps-v2.0.{y}.{m:02d}.{d}.tif.gz"
  baseline_years: [1991, 2020]
  # Saison des pluies (mois de début et de fin). Madagascar : novembre -> avril
  season_start_month: 11
  season_end_month: 4
  # En dessous de ce cumul normal (mm), le % de la normale n'est pas calculé (début de saison)
  min_normal_mm: 25

# --- Niveaux d'alerte pluie (PROVISOIRES : à calibrer avec Météo Madagascar, BNGRC, groupe IPC) ---
# Ratio pluie cumulée / normale (%). Du plus sévère au moins sévère.
alert_levels:
  - {level: 4, name: Urgence, below_pct: 50}
  - {level: 3, name: Alerte,  below_pct: 75}
  - {level: 2, name: Veille,  below_pct: 90}
  - {level: 1, name: Normal,  below_pct: 1000000}

# Une unité est dite « exposée » à partir de ce niveau
exposure_min_level: 3

# Part vulnérable par défaut (PROVISOIRE). Approximation : environ 80 % de la population vit sous
# le seuil de pauvreté international (PAM, Country Brief Madagascar, mars 2026).
# À REMPLACER par des données IPC / enquêtes dans inputs/vulnerabilite.csv
default_vulnerable_share: 0.80

# Part nationale de femmes de 15-49 ans dans la population totale (Nations Unies, World Population
# Prospects 2024, projection Madagascar 2026 : 8 337 912 femmes de 15-49 ans / 33 522 051 habitants).
# Utilisée uniquement pour estimer un nombre de femmes enceintes dans la population exposée, combinée au
# % régional de femmes actuellement enceintes (EDS/DHS, voir dhs_femmes_enceintes_pct) -- jamais mesurée
# par fokontany, donc l'estimation reste étiquetée « Approximation » (deux hypothèses empilées).
femmes_15_49_pct: 0.2487

# Simulation de sensibilité : multiplicateurs appliqués à la pluie cumulée
simulation:
  rain_factors: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00,
                 1.05, 1.10, 1.15, 1.20, 1.25, 1.30, 1.35, 1.40, 1.45, 1.50]

# --- Alerte précoce (prévisions météo, mises à jour automatiques) — SEUILS PROVISOIRES à calibrer avec Météo Madagascar et le BNGRC ---
timezone: Indian/Antananarivo
forecast:
  grid_res: 0.25          # degrés : une prévision par maille de 0,25° (environ 28 km), attribuée aux fokontany voisins
  forecast_days: 16
  past_days: 10           # jours récents (analyse du modèle) pour combler le retard des données satellites
  max_age_days: 3         # au-delà, la prévision est considérée périmée et ignorée
  horizon_days: 7         # les niveaux d'alerte portent sur les 7 prochains jours
alerts:
  rain_day_mm: [50, 100, 200]       # pluie sur une journée : vigilance, alerte, alerte maximale
  rain_3day_mm: [100, 200, 350]     # pluie cumulée sur 3 jours
  gust_kmh: [60, 90, 118]           # rafales de vent
  tmax_c: [35, 38, 41]              # température maximale
  dry_days: [10, 15, 21]            # jours secs consécutifs (< 1 mm), en saison des pluies seulement
desinventar:                        # base des pertes et dommages (UNDRR), vérité terrain d'impact
  country: mdg                      # code DesInventar du pays
  pcode_prefix: "MG"                # code de district DesInventar 11117 -> pcode MG11117
  split:                            # districts de 2011 découpés depuis
    MG11101: [MG11118, MG11119, MG11120, MG11121, MG11122, MG11123]   # Antananarivo Renivohitra -> 6 arrondissements
flood:
  return_levels: [2, 5, 20]         # débit de rivière dépassant la crue de 2, 5 ou 20 ans
  min_q2_m3s: 5                     # petits cours d'eau ignorés (débit de crue de 2 ans < 5 m3/s)
  history_start: 1984

# --- Hydrologie de terrain (MNT Copernicus GLO-90, workflow « 5 - Hydrologie ») ---
hydro:
  res_deg: 0.005          # ~550 m
  stream_min_km2: 100     # un cours d'eau commence à 100 km² drainés
  basin_min_km2: 500      # grands bassins versants
  subbasin_min_km2: 300   # sous-bassins (jonctions)
