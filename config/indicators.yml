# Registre des indicateurs MakyClimat.
# status: active (calculé aujourd'hui) | planned (prévu, connecteur à écrire)
# Chaque indicateur est rattaché à un ou plusieurs secteurs, ODD et cadres nationaux (à valider).
# Pour ajouter un indicateur : ajouter un bloc ici + écrire (ou réutiliser) un connecteur dans scripts/.

indicators:
  # ---------------- ACTIFS (phase 1) ----------------
  - id: rain_pct_normal
    label: Pluie cumulée de la saison (% de la normale)
    unit: "%"
    sectors: [food_security, agriculture, livestock, wash]
    sdg: ["2.4", "13.1"]
    national: [axe1, solidarite]
    source: CHIRPS v2.0 (CHC/UCSB), normale 1991-2020
    frequency: Tous les 10 jours (dékade)
    status: active
  - id: drought_alert_level
    label: Niveau d'alerte sécheresse (normal, veille, alerte, urgence)
    unit: niveau
    sectors: [food_security, agriculture, livestock, wash, drr]
    sdg: ["1.5", "2.4", "13.1"]
    national: [axe1, solidarite]
    source: Dérivé de CHIRPS, seuils provisoires à calibrer
    frequency: Tous les 10 jours
    status: active
  - id: population
    label: Population (estimation)
    unit: personnes
    sectors: [food_security, nutrition, health, wash, education, protection, shelter]
    sdg: ["1.5", "11.5"]
    national: [axe1]
    source: OCHA COD-PS Madagascar (référence 2018, INSTAT/BNGRC)
    frequency: Ponctuelle (à remplacer par WorldPop/RGPH)
    status: active
  - id: population_exposed
    label: Population exposée à la sécheresse
    unit: personnes
    sectors: [food_security, nutrition, health, wash, agriculture, drr]
    sdg: ["1.5", "11.5", "13.1"]
    national: [axe1, solidarite]
    source: Population x niveau d'alerte
    frequency: Tous les 10 jours
    status: active
  - id: potential_targets
    label: Cibles potentiels (estimation)
    unit: personnes
    sectors: [food_security, nutrition, social_protection, early_recovery]
    sdg: ["1.5", "2.1"]
    national: [axe1, solidarite]
    source: Population exposée x part vulnérable (par défaut provisoire ou fournie)
    frequency: Tous les 10 jours
    status: active
  - id: response_coverage
    label: Bénéficiaires déclarés par les partenaires et écart
    unit: personnes
    sectors: [food_security, nutrition, health, wash, education, protection, shelter]
    sdg: ["17.17"]
    national: [axe1, solidarite]
    source: Fichier inputs/interventions.csv (partenaires de mise en œuvre)
    frequency: À chaque mise à jour du fichier
    status: active

  # ---------------- PRÉVUS (phases 2 à 4) ----------------
  - id: flood_exposure
    label: Exposition aux inondations (prévision de crue et zones inondables)
    unit: personnes
    sectors: [drr, shelter, health, wash, food_security]
    sdg: ["11.5", "13.1"]
    national: [axe1, eau]
    source: "Google Flood Hub, Copernicus GloFAS (à vérifier)"
    frequency: Quotidienne
    status: planned
  - id: cyclone_exposure
    label: Exposition aux cyclones (trajectoire, vent, pluie)
    unit: personnes
    sectors: [drr, shelter, education, health, logistics]
    sdg: ["11.5", "13.1"]
    national: [axe1]
    source: Prévisions ECMWF, Météo Madagascar
    frequency: Quotidienne en saison cyclonique
    status: planned
  - id: et0_water_balance
    label: Évapotranspiration, humidité du sol et bilan hydrique
    unit: mm
    sectors: [agriculture, livestock, wash, food_security]
    sdg: ["2.4", "6.4"]
    national: [axe1, eau]
    source: ERA5-Land / modèle FAO-56 (à construire)
    frequency: Quotidienne
    status: planned
  - id: ndvi_anomaly
    label: Anomalie de végétation (images satellites)
    unit: indice
    sectors: [agriculture, livestock, food_security]
    sdg: ["2.4", "15.3"]
    national: [axe1]
    source: MODIS/VIIRS, Sentinel-2 (à vérifier)
    frequency: Tous les 10 jours
    status: planned
  - id: crop_production_risk
    label: Risque de baisse de production agricole
    unit: indice
    sectors: [agriculture, food_security, nutrition]
    sdg: ["2.3", "2.4"]
    national: [axe1, solidarite]
    source: Modèle de stress hydrique des cultures (à valider scientifiquement)
    frequency: Tous les 10 jours
    status: planned
  - id: air_quality_pm25
    label: Qualité de l'air (PM2.5, pureté de l'air)
    unit: µg/m3
    sectors: [environment, health]
    sdg: ["3.9", "11.6"]
    national: [sante]
    source: Copernicus CAMS (à vérifier)
    frequency: Quotidienne
    status: planned
  - id: wash_access
    label: Accès à l'eau potable et à l'assainissement
    unit: "% population"
    sectors: [wash, health]
    sdg: ["6.1", "6.2"]
    national: [axe1, eau]
    source: "JMP OMS/UNICEF, enquêtes (désagrégation à définir)"
    frequency: Annuelle
    status: planned
  - id: health_access
    label: Accès aux formations sanitaires et risque épidémique
    unit: "% population à moins de 5 km"
    sectors: [health, nutrition]
    sdg: ["3.8"]
    national: [axe1, sante]
    source: "Listes d'établissements, DHIS2 (accès à négocier)"
    frequency: Mensuelle
    status: planned
  - id: school_continuity_risk
    label: Risque de rupture de scolarité (écoles exposées aux aléas)
    unit: écoles
    sectors: [education, drr]
    sdg: ["4.1", "4.a"]
    national: [axe1, education]
    source: "Données EMIS du ministère de l'Éducation (accès à négocier)"
    frequency: Annuelle
    status: planned
  - id: livestock_pasture
    label: Disponibilité de pâturage et d'eau pour l'élevage
    unit: indice
    sectors: [livestock, food_security]
    sdg: ["2.3"]
    national: [axe1]
    source: NDVI + points d'eau (à construire)
    frequency: Tous les 10 jours
    status: planned
  - id: ipc_phase3plus_pct
    label: Population en insécurité alimentaire aiguë (IPC phase 3 ou plus)
    unit: "%"
    format: pct
    aggregate: popmean
    sectors: [food_security, nutrition]
    sdg: ["2.1"]
    national: [axe1, solidarite]
    source: "IPC via HDX HAPI (OCHA) — remplace la part vulnérable par défaut là où il existe"
    frequency: Selon les analyses IPC (2 fois par an)
    status: active
  - id: ipc_phase3plus_pop
    label: Personnes en IPC phase 3 ou plus
    unit: personnes
    format: int
    aggregate: sum
    sectors: [food_security, nutrition]
    sdg: ["2.1"]
    national: [axe1, solidarite]
    source: IPC via HDX HAPI (OCHA)
    frequency: Selon les analyses IPC
    status: active
  - id: poverty_headcount
    label: Taux de pauvreté multidimensionnelle (part de la population)
    unit: "%"
    format: pct
    aggregate: none
    sectors: [social_protection, food_security, health, education, wash]
    sdg: ["1.2"]
    national: [axe1, solidarite]
    source: "Indice de pauvreté multidimensionnelle via HDX HAPI (niveau région)"
    frequency: Ponctuelle
    status: active
  - id: rain_trend_pct_decade
    label: Tendance de la pluie saisonnière 1982-aujourd'hui (points de % de la normale par décennie)
    unit: "points de % / décennie"
    format: float
    style: signed
    aggregate: popmean
    sectors: [agriculture, food_security, livestock, wash, drr]
    sdg: ["13.1", "2.4"]
    national: [axe1]
    source: CHIRPS v2.0 (CHC/UCSB), régression linéaire sur la pluie de chaque saison
    frequency: Annuelle (recalcul après chaque saison)
    status: active
  - id: rain_trend_signif_share
    label: Part de la zone où la tendance est statistiquement significative (p < 0,10)
    unit: "%"
    format: pct
    aggregate: popmean
    sectors: [agriculture, food_security, drr]
    sdg: ["13.1"]
    national: [axe1]
    source: CHIRPS v2.0, test t sur la pente (à confirmer par un test non paramétrique pour la thèse)
    frequency: Annuelle
    status: active
  - id: enso_el_pct
    label: Pluie de la saison lors des El Niño passés (% de la normale)
    unit: "% de la normale"
    format: pct
    style: rainpct
    aggregate: popmean
    sectors: [agriculture, food_security, livestock, wash, drr, health]
    sdg: ["13.1", "2.4", "1.5"]
    national: [axe1, solidarite]
    source: CHIRPS v2.0 et indice ONI (NOAA CPC), moyenne des saisons classées El Niño
    frequency: Annuelle
    status: active
  - id: enso_la_pct
    label: Pluie de la saison lors des La Niña passées (% de la normale)
    unit: "% de la normale"
    format: pct
    style: rainpct
    aggregate: popmean
    sectors: [agriculture, food_security, livestock, wash, drr, health]
    sdg: ["13.1", "2.4", "1.5"]
    national: [axe1, solidarite]
    source: CHIRPS v2.0 et indice ONI (NOAA CPC), moyenne des saisons classées La Niña
    frequency: Annuelle
    status: active
  - id: enso_corr
    label: Corrélation entre la pluie de la saison et l'indice ENSO (ONI), de -1 à +1
    unit: coefficient
    format: float
    style: signed
    aggregate: popmean
    sectors: [agriculture, food_security, drr]
    sdg: ["13.1"]
    national: [axe1]
    source: CHIRPS v2.0 et ONI (NOAA CPC), corrélation de Pearson
    frequency: Annuelle
    status: active
  # ---------------- HYDROLOGIE DE TERRAIN (calculé depuis le MNT Copernicus, workflow « 5 - Hydrologie ») ----------------
  - id: hand_lt5_pct
    label: Part du territoire à moins de 5 m au-dessus d'un cours d'eau (susceptibilité topographique à l'inondation)
    unit: "% de la surface"
    format: pct
    aggregate: none
    sectors: [drr, shelter, wash, health, agriculture]
    sdg: ["11.5", "13.1"]
    national: [axe1, eau]
    source: "Copernicus GLO-90, HAND (Rennó 2008) calculé par MakyClimat ; indicateur de susceptibilité, pas une carte de crue"
    frequency: Ponctuelle
    status: active
  - id: hand_lt15_pct
    label: Part du territoire à moins de 15 m au-dessus d'un cours d'eau
    unit: "% de la surface"
    format: pct
    aggregate: none
    sectors: [drr, shelter, wash, agriculture]
    sdg: ["11.5", "13.1"]
    national: [axe1, eau]
    source: Copernicus GLO-90, HAND calculé par MakyClimat
    frequency: Ponctuelle
    status: active
  - id: slope_mean_pct
    label: Pente moyenne du terrain
    unit: "%"
    format: float
    aggregate: none
    sectors: [drr, agriculture, logistics]
    sdg: ["13.1", "15.3"]
    national: [axe1]
    source: Copernicus GLO-90 (maille ~550 m, la pente locale est sous-estimée)
    frequency: Ponctuelle
    status: active
  - id: slope_gt30_pct
    label: Part du territoire en pente de plus de 30 % (susceptibilité aux glissements)
    unit: "% de la surface"
    format: pct
    aggregate: none
    sectors: [drr, agriculture, logistics]
    sdg: ["11.5", "13.1"]
    national: [axe1]
    source: Copernicus GLO-90, calcul MakyClimat (indicateur de susceptibilité)
    frequency: Ponctuelle
    status: active
  - id: elev_mean_m
    label: Altitude moyenne
    unit: m
    format: int
    aggregate: none
    sectors: [agriculture, health, drr]
    sdg: ["13.1"]
    national: [axe1]
    source: Copernicus GLO-90
    frequency: Ponctuelle
    status: active
  - id: river_max_km2
    label: Plus grande surface drainée par un cours d'eau de la zone
    unit: km²
    format: int
    aggregate: none
    sectors: [drr, wash]
    sdg: ["6.4", "13.1"]
    national: [eau]
    source: Copernicus GLO-90, accumulation d'écoulement calculée par MakyClimat
    frequency: Ponctuelle
    status: active
  - id: slope_ge15_pct
    label: Part du territoire en pente de 15 % ou plus (« collines » selon la classification FAO des pentes)
    unit: "% de la surface"
    format: pct
    aggregate: none
    sectors: [drr, agriculture, logistics]
    sdg: ["11.5", "13.1"]
    national: [axe1]
    source: Copernicus GLO-90 ; classe de pente FAO (Guidelines for soil description, 2006) ; maille ~550 m
    frequency: Ponctuelle
    status: active
  # ---------------- EAU DANS LE SOL (workflow « 6 - Eau dans le sol ») ----------------
  - id: sm_rel_pct
    label: Humidité du sol (% de la réserve utile) au dernier mois complet
    unit: "% de la réserve utile"
    format: pct
    aggregate: none
    sectors: [agriculture, food_security, livestock, wash, drr]
    sdg: ["2.4", "6.4", "13.1"]
    national: [axe1, eau]
    source: "Bilan hydrique de Thornthwaite-Mather : CHIRPS, ET0 FAO-56 d'ERA5-Land, sols SoilGrids, occupation du sol WorldCover"
    frequency: Mensuelle
    status: active
  - id: sm_z
    label: Humidité du sol par rapport à la normale du mois (indice standardisé, 0 = normal, négatif = plus sec)
    unit: "écart-type"
    format: float
    style: signed
    aggregate: none
    sectors: [agriculture, food_security, livestock, wash, drr]
    sdg: ["2.4", "13.1"]
    national: [axe1, eau]
    source: "Scores normaux sur 1981-aujourd'hui (méthode SPI/SGI : McKee 1993, Bloomfield & Marchant 2013)"
    frequency: Mensuelle
    status: active
  - id: spi3
    label: "Indice de précipitation standardisé SPI-3 mois (sécheresse agricole à court terme)"
    unit: "écart-type"
    format: float
    style: signed
    aggregate: none
    sectors: [agriculture, food_security, livestock, wash, drr]
    sdg: ["2.4", "13.1"]
    national: [axe1, eau]
    source: "SPI (McKee et al. 1993 ; Guide de l'utilisateur du SPI, OMM-N° 1090, 2012) calculé sur la pluie CHIRPS 1981-aujourd'hui, loi gamma par mois du calendrier. Lecture OMM : -1 à -1,49 modérément sec, -1,5 à -1,99 sévèrement sec, -2 et moins extrêmement sec. Mesure d'intensité du choc agroécologique (JIAF)."
    frequency: Mensuelle
    status: active
  - id: spi6
    label: "Indice de précipitation standardisé SPI-6 mois (sécheresse agricole et hydrologique)"
    unit: "écart-type"
    format: float
    style: signed
    aggregate: none
    sectors: [agriculture, food_security, livestock, wash, drr]
    sdg: ["2.4", "13.1"]
    national: [axe1, eau]
    source: "SPI (McKee et al. 1993 ; Guide de l'utilisateur du SPI, OMM-N° 1090, 2012) calculé sur la pluie CHIRPS 1981-aujourd'hui, loi gamma par mois du calendrier. Lecture OMM : -1 à -1,49 modérément sec, -1,5 à -1,99 sévèrement sec, -2 et moins extrêmement sec. Mesure d'intensité du choc agroécologique (JIAF)."
    frequency: Mensuelle
    status: active
  - id: spi12
    label: "Indice de précipitation standardisé SPI-12 mois (sécheresse hydrologique de long terme)"
    unit: "écart-type"
    format: float
    style: signed
    aggregate: none
    sectors: [agriculture, food_security, livestock, wash, drr]
    sdg: ["2.4", "13.1"]
    national: [axe1, eau]
    source: "SPI (McKee et al. 1993 ; Guide de l'utilisateur du SPI, OMM-N° 1090, 2012) calculé sur la pluie CHIRPS 1981-aujourd'hui, loi gamma par mois du calendrier. Lecture OMM : -1 à -1,49 modérément sec, -1,5 à -1,99 sévèrement sec, -2 et moins extrêmement sec. Mesure d'intensité du choc agroécologique (JIAF)."
    frequency: Mensuelle
    status: active
  - id: recharge12_mm
    label: Recharge potentielle des 12 derniers mois (eau infiltrée au-delà de la réserve utile du sol, nette du ruissellement SCS-CN)
    unit: mm
    format: int
    aggregate: none
    sectors: [wash, agriculture, drr]
    sdg: ["6.4", "13.1"]
    national: [eau]
    source: "Bilan de Thornthwaite-Mather (excédent au-delà de la réserve utile du sol) ; le ruissellement SCS-CN (USDA-NRCS NEH-4) est retiré de la pluie avant le bilan, donc cet excédent ne compte pas l'eau qui a ruisselé (voir runoff12_mm)"
    frequency: Mensuelle
    status: active
  - id: runoff12_mm
    label: Ruissellement des 12 derniers mois (méthode SCS-CN ; eau qui n'entre pas dans le bilan du sol, à distinguer de la recharge)
    unit: mm
    format: int
    aggregate: none
    sectors: [wash, drr]
    sdg: ["6.4", "13.1"]
    national: [eau]
    source: "USDA-NRCS NEH-4, courbe-numéro SCS (Q = (P-0,2S)²/(P+0,8S)), condition antécédente selon le stock relatif du sol (Hawkins et al. 1985) ; appliqué au pas mensuel (approximation documentée, pas de pluie journalière disponible à l'échelle du pays)"
    frequency: Mensuelle
    status: active
  - id: recharge12_z
    label: Indice relatif de nappe (recharge sur 12 mois standardisée ; négatif = nappe probablement basse)
    unit: "écart-type"
    format: float
    style: signed
    aggregate: none
    sectors: [wash, agriculture, health]
    sdg: ["6.1", "6.4"]
    national: [eau]
    source: "Méthode de Bloomfield & Marchant (2013) appliquée à la recharge calculée ; INDICE relatif, pas un niveau mesuré (calibrage possible avec des mesures de puits)"
    frequency: Mensuelle
    status: active
  - id: whc_mm
    label: Réserve utile en eau du sol (profondeur racinaire comprise)
    unit: mm
    format: int
    aggregate: none
    sectors: [agriculture, food_security]
    sdg: ["2.4"]
    national: [axe1]
    source: "Saxton & Rawls (2006) sur SoilGrids ; profondeurs racinaires FAO-56 par occupation du sol (WorldCover)"
    frequency: Ponctuelle
    status: active
  - id: aquifer_productivity_pct
    label: "Productivité d'aquifère (classement 0-100 de la classe BGS : socle, sédimentaire, volcanique, karst)"
    unit: "indice 0-100"
    format: float
    aggregate: none
    sectors: [wash, drr]
    sdg: ["6.1"]
    national: [axe1, eau]
    source: "British Geological Survey, Africa Groundwater Atlas Country Hydrogeology Maps (1:5 000 000, CC BY-SA) ; échelle continentale, pas un sondage de terrain — voir validation/groundwater_limites.md"
    frequency: Ponctuelle
    status: active
  - id: aquifer_yield_lsec_mid
    label: "Débit indicatif médian de la classe d'aquifère (ordre de grandeur, PAS une prévision de débit de forage)"
    unit: L/s
    format: float
    aggregate: none
    sectors: [wash]
    sdg: ["6.1"]
    national: [eau]
    source: "British Geological Survey, Africa Groundwater Atlas (classes de productivité : VL <0,1 ; L 0,1-0,5 ; LM 0,5-2 ; M 2-5 ; H 5-20 ; VH >20 L/s)"
    frequency: Ponctuelle
    status: active
  - id: water_table_depth_m
    label: Profondeur de nappe publiée à l'échelle régionale (ordre de grandeur, pas une mesure locale)
    unit: m
    format: float
    aggregate: none
    sectors: [wash, agriculture]
    sdg: ["6.1"]
    national: [eau]
    source: "MacDonald et al. (2012) Environ. Res. Lett. 7:024009 ; Bonsor & MacDonald (2011) BGS OR/11/067 ; grille continentale ~5 km, republiée par l'UNESCO-IHP avec l'autorisation du BGS/NERC — voir validation/groundwater_limites.md"
    frequency: Ponctuelle
    status: active
  - id: cn2
    label: Courbe-numéro de ruissellement (CN, condition moyenne ; plus élevé = plus de ruissellement)
    unit: indice
    format: int
    aggregate: none
    sectors: [drr, agriculture, wash]
    sdg: ["11.5", "13.1"]
    national: [eau]
    source: USDA-NRCS NEH-4 ; groupe hydrologique déduit de la texture SoilGrids ; occupation du sol WorldCover
    frequency: Ponctuelle
    status: active
  # ---------------- ACCESSIBILITÉ (HeiGIT / OpenStreetMap, niveau district) ----------------
  - id: acc_hosp_1h_pct
    label: Population à moins d'1 h d'un hôpital (valeur du district)
    unit: "% de la population"
    format: pct
    aggregate: popmean
    inherit: down
    sectors: [health, nutrition, logistics, drr]
    sdg: ["3.8"]
    national: [axe1, sante]
    source: "HeiGIT GAIA (WorldPop, OpenStreetMap, openrouteservice) via HDX ; temps théoriques"
    frequency: Ponctuelle (mise à jour par HeiGIT)
    status: active
  - id: acc_phc_1h_pct
    label: Population à moins d'1 h d'un centre de santé de base (valeur du district)
    unit: "% de la population"
    format: pct
    aggregate: popmean
    inherit: down
    sectors: [health, nutrition, logistics]
    sdg: ["3.8"]
    national: [axe1, sante]
    source: HeiGIT GAIA (WorldPop, OpenStreetMap) via HDX
    frequency: Ponctuelle
    status: active
  - id: acc_edu_5km_pct
    label: Population à moins de 5 km d'une école (valeur du district)
    unit: "% de la population"
    format: pct
    aggregate: popmean
    inherit: down
    sectors: [education, logistics]
    sdg: ["4.1", "4.a"]
    national: [axe1, education]
    source: HeiGIT GAIA (WorldPop, OpenStreetMap) via HDX
    frequency: Ponctuelle
    status: active
  - id: rai_pct
    label: Accès rural aux routes revêtues (population rurale à moins de 2 km d'une route revêtue, valeur du district)
    unit: "% de la population rurale"
    format: pct
    aggregate: popmean
    inherit: down
    sectors: [logistics, food_security, health, drr]
    sdg: ["9.1"]
    national: [axe1]
    source: "HeiGIT GAIA (indice d'accès rural, définition Banque mondiale) via HDX ; surface des routes : Mapillary et Planet ; ne compte pas les pistes en terre"
    frequency: Ponctuelle
    status: active
  # ---------------- EXPOSITION AUX CRUES (HeiGIT) ----------------
  - id: crue_rp10_ecoles_pct
    label: "Part des écoles inondées, crue décennale (fréquente), hauteur d'eau d'au moins 30 cm (valeur du district)"
    unit: "%"
    format: pct
    aggregate: none
    inherit: down
    sectors: [education, drr, wash]
    sdg: ["11.5", "13.1"]
    national: [axe1, eau]
    source: "HeiGIT (Université de Heidelberg) via HDX, cartes d'aléa de crue modélisées ; exposition estimée, pas une crue observée"
    frequency: Ponctuelle
    status: active
  - id: crue_rp10_hopitaux_pct
    label: "Part des hôpitaux inondés, crue décennale (fréquente), hauteur d'eau d'au moins 30 cm (valeur du district)"
    unit: "%"
    format: pct
    aggregate: none
    inherit: down
    sectors: [health, drr, wash]
    sdg: ["11.5", "13.1"]
    national: [axe1, eau]
    source: "HeiGIT (Université de Heidelberg) via HDX, cartes d'aléa de crue modélisées ; exposition estimée, pas une crue observée"
