name: 6 - Eau dans le sol (humidité, recharge, indice de nappe)

# Bilan hydrique mensuel du sol à partir de données réelles : pluie CHIRPS, évapotranspiration ERA5-Land (FAO-56), sols SoilGrids, occupation du sol WorldCover.
# La récupération de l'évapotranspiration est reprenable : si elle n'est pas terminée, relancer le workflow.
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  soilwater:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Eau dans le sol
        run: python scripts/build_soilwater.py --country "${{ github.event.inputs.country || 'mdg' }}"
      - name: Géologie et type d'aquifère (BGS Africa Groundwater Atlas) — ignorée en cas d'indisponibilité
        run: python scripts/connector_geology.py --country "${{ github.event.inputs.country || 'mdg' }}" || echo "Géologie/aquifère indisponible"
      - name: Profondeur de nappe (MGMERL, mesures réelles de forages) — ignorée en cas d'indisponibilité
        run: |
          (python scripts/connector_watertable.py --country "${{ github.event.inputs.country || 'mdg' }}" || echo "Profondeur de nappe indisponible") 2>&1 | tee validation/_journal_watertable.txt
      - name: Qualité de l'eau — conductivité électrique (MGMERL, mesures réelles) — ignorée en cas d'indisponibilité
        run: python scripts/connector_mgmerl_quality.py --country "${{ github.event.inputs.country || 'mdg' }}" || echo "Conductivité indisponible"
      - name: Enregistrer le journal de diagnostic temporaire (profondeur de nappe)
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f validation/_journal_watertable.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Journal de diagnostic temporaire (profondeur de nappe)" && git pull --rebase --autostash origin main && git push)
      - name: Potentiel pour point d'eau peu profond (expérimental, non validé) — ignoré si hydro.csv absent
        run: python scripts/build_groundwater.py --country "${{ github.event.inputs.country || 'mdg' }}" || echo "Potentiel eau indisponible"
      - name: Bilan hydrique par sous-bassin versant (expérimental, non validé) — ignoré si hydro_units.csv absent
        run: python scripts/build_subbasin_balance.py --country "${{ github.event.inputs.country || 'mdg' }}" || echo "Bilan par sous-bassin indisponible"
      - name: Enregistrer dans le dépôt (même en cas d'échec partiel, pour garder le cache et l'état)
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f docs/data data validation/spi_regions.csv 2>/dev/null || git add docs/data data
          git diff --cached --quiet || (git commit -m "Eau dans le sol : bilan hydrique mensuel, géologie, profondeur de nappe, sous-bassins" && git pull --rebase --autostash origin main && git push)
