name: 13 - Routes exposées aux crues et enclavement

# Routes principales OpenStreetMap croisées avec la HAND : tronçons en zone basse et éloignement des routes.
# À relancer seulement si la hydrologie de terrain ou les limites changent.
on:
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Routes exposées
        shell: bash
        run: python scripts/build_road_exposure.py --country "${{ github.event.inputs.country || 'mdg' }}" 2>&1 | tee data/_routes_log.txt
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f data/_routes_log.txt data/mdg/external/routes.csv
          git diff --cached --quiet || (git commit -m "Routes exposées aux crues (OSM x HAND)" && git pull --rebase origin main && git push)
