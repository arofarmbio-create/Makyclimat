name: 9 - Validation sur événements réels

# Compare nos indicateurs (vent IBTrACS, pluie CHIRPS journalière) aux régions touchées documentées (validation/zones_touchees.csv).
on:
  schedule:
    - cron: "0 7 3 1,4,7,10 *"   # tous les trimestres : nouveaux événements documentés
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Climatologie locale des pluies extrêmes (CHIRPS journalier, reprise possible)
        timeout-minutes: 100
        continue-on-error: true
        shell: bash
        run: python scripts/build_rx3_clim.py --country "${{ github.event.inputs.country || 'mdg' }}" 2>&1 | tee validation/_journal_rx3.txt
      - name: Enregistrer la climatologie
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f data validation
          git diff --cached --quiet || (git commit -m "Climatologie locale des pluies extrêmes (rx3)" && git pull --rebase origin main && git push)
      - name: Validation
        shell: bash
        run: python scripts/validate_events.py --country "${{ github.event.inputs.country || 'mdg' }}" 2>&1 | tee validation/_journal.txt
      - name: Déclencheurs d'action anticipée (seuils simples, exploratoire)
        shell: bash
        run: python scripts/build_triggers.py 2>&1 | tee validation/_journal_declencheurs.txt
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f validation docs/data
          git diff --cached --quiet || (git commit -m "Validation sur événements réels : résultats" && git pull --rebase origin main && git push)
