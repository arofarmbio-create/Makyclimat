name: 3 - Seuils de crue des rivières (une fois par an)

# Calcule, pour chaque commune, les débits de crue de 2, 5, 10 et 20 ans à partir de l'historique du modèle GloFAS (1984 à aujourd'hui).
# Enchaînement automatique après la normale de pluie (premier démarrage) ; à relancer une fois par an.
on:
  schedule:
    - cron: "30 3 * * *"   # reprise quotidienne jusqu'à ce que toutes les communes aient leurs seuils (quota gratuit de l'API)
  workflow_run:
    workflows: ["2 - Construire la normale de pluie (une seule fois)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  floods:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements-update.txt
      - name: Seuils de crue par commune
        run: python scripts/update_floods.py --country "${{ github.event.inputs.country || 'mdg' }}" --thresholds --max-locations 100
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Seuils de crue des rivières" && git pull --rebase --autostash origin main && git push)
