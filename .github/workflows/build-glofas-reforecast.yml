name: 14 - Reprévisions GloFAS v4 réduites (vérification par l'impact)

# Télécharge les reprévisions GloFAS v4 (Copernicus EWDS) mois par mois, les réduit (mailles de rivière, maximum par
# fenêtre d'échéance) et les range dans la release GitHub « reprevisions-glofas-v4 » (hors du dépôt git).
# Un mois ≈ 9 min d'attente EWDS, parfois des heures. Manuel.
# Depuis le 10/11/2026 : un job par mois (et non plus par année) avec 355 min chacun, le plafond de GitHub étant 360.
# Le 09/11, le job 2010 avait été arrêté au bout de 300 min, toute l'année bloquée derrière un mois. Les mois déjà
# publiés dans la release ne créent plus de job, et un mois en échec rend son job rouge au lieu d'un simple avertissement.
on:
  # Lancement automatique hebdomadaire arrêté le 09/11/2026 (portée réduite, protocole_verification_impact.md).
  workflow_dispatch:
    inputs:
      years:
        description: "Années séparées par des espaces (2003-2023 pour la v4)"
        default: "2018"
      months:
        description: "Mois (saison des pluies par défaut)"
        default: "1 2 3 4 11 12"

permissions: {}

env:
  COUNTRY: mdg
  TAG: reprevisions-glofas-v4

# Idempotence (10/11/2026) : un lancement identique (même workflow, branche et paramètres) attend la fin du précédent
# au lieu de tourner en parallèle ; des paramètres différents restent indépendants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ join(github.event.inputs.*, '-') }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read           # lire la liste des fichiers de la release
    outputs:
      pairs: ${{ steps.y.outputs.pairs }}
      count: ${{ steps.y.outputs.count }}
    steps:
      - id: y
        env:
          REQUESTED_YEARS: ${{ inputs.years || '2010 2012 2013 2017 2019 2020 2022 2023' }}
          REQUESTED_MONTHS: ${{ inputs.months || '1 2 3 4 11 12' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! [[ "$REQUESTED_YEARS" =~ ^[[:blank:]0-9]+$ && "$REQUESTED_MONTHS" =~ ^[[:blank:]0-9]+$ ]]; then
            echo "::error::Saisir les années et les mois avec des chiffres séparés par des espaces"
            exit 1
          fi
          read -r -a years <<< "$REQUESTED_YEARS"
          read -r -a months <<< "$REQUESTED_MONTHS"
          if (( ${#years[@]} == 0 || ${#months[@]} == 0 )); then
            echo "::error::Au moins une année et un mois sont nécessaires"
            exit 1
          fi
          for year in "${years[@]}"; do
            if ! [[ "$year" =~ ^20(0[3-9]|1[0-9]|2[0-3])$ ]]; then
              echo "::error::Années admises : 2003 à 2023"
              exit 1
            fi
          done
          for i in "${!months[@]}"; do
            if ! [[ "${months[i]}" =~ ^(0?[1-9]|1[0-2])$ ]]; then
              echo "::error::Mois admis : 1 à 12"
              exit 1
            fi
            months[i]="${months[i]#0}"
          done
          # Relecture Codex (10/11) : une erreur de lecture ne doit pas passer pour une release vide (retéléchargement
          # et écrasement des mois publiés). Seule une release absente donne un inventaire vide.
          if ! published=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>release_err.txt); then
            if grep -qi "release not found" release_err.txt; then
              published=""
            else
              echo "::error::Inventaire de la release illisible : $(head -c 300 release_err.txt)"
              exit 1
            fi
          fi
          pairs=""
          count=0
          for year in "${years[@]}"; do
            for month in "${months[@]}"; do
              name=$(printf 'glofas_v4_%s_%02d.npz' "$year" "$month")
              if grep -qx "$name" <<< "$published"; then
                echo "$name : déjà publié, pas de job"
                continue
              fi
              pairs+=$(printf '{"year":"%s","month":"%s"},' "$year" "$month")
              count=$((count + 1))
            done
          done
          echo "$count mois à télécharger"
          printf 'pairs=[%s]\ncount=%s\n' "${pairs%,}" "$count" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: build (${{ matrix.year }}-${{ matrix.month }})
    runs-on: ubuntu-latest
    timeout-minutes: 355       # plafond GitHub : 360 min par job
    permissions:
      contents: write
    env:
      YEAR: ${{ matrix.year }}
      MONTH: ${{ matrix.month }}
    strategy:
      max-parallel: 1          # une requête à la fois : EWDS refuse au-delà d'une file par compte (01/11/2026)
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install numpy pandas pyyaml "cdsapi>=0.7.4" xarray cfgrib eccodes
      - name: Release de stockage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Reprévisions GloFAS v4 réduites" \
            --notes "Données de travail de la vérification par l'impact (validation/protocole_verification_impact.md). Copernicus EWDS, GloFAS v4 ; réduites par scripts/build_glofas_reforecast.py."
          mkdir -p "data/$COUNTRY/reforecast"
      - name: Télécharger, réduire et publier le mois
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_glofas_reforecast.py --country "$COUNTRY" --year "$YEAR" --months "$MONTH"
          f="data/$COUNTRY/reforecast/glofas_v4_${YEAR}_$(printf %02d "$MONTH").npz"
          test -f "$f" || { echo "::error::${YEAR}-${MONTH} : fichier réduit absent"; exit 1; }
          gh release upload "$TAG" "$f" --clobber
