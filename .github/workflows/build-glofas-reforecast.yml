name: 14 - Reprévisions GloFAS v4 réduites (vérification par l'impact)

# Télécharge les reprévisions GloFAS v4 (Copernicus EWDS) mois par mois, les réduit (mailles de rivière, maximum par
# fenêtre d'échéance) et les range dans la release GitHub « reprevisions-glofas-v4 » (hors du dépôt git).
# Un mois ≈ 9 min d'attente EWDS. Reprend là où il s'est arrêté (les mois déjà publiés sont sautés). Manuel.
on:
  # Lancement automatique hebdomadaire arrêté le 09/11/2026 (portée réduite, protocole_verification_impact.md).
  workflow_dispatch:
    inputs:
      years:
        description: "Années séparées par des espaces (2003-2023 pour la v4)"
        default: "2018"
      months:
        description: "Mois (saison des pluies par défaut)"
        default: "1 2 3 4 11 12"

permissions: {}

env:
  COUNTRY: mdg
  TAG: reprevisions-glofas-v4

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.y.outputs.years }}
      months: ${{ steps.y.outputs.months }}
    steps:
      - id: y
        env:
          REQUESTED_YEARS: ${{ inputs.years || '2010 2012 2013 2017 2019 2020 2022 2023' }}
          REQUESTED_MONTHS: ${{ inputs.months || '1 2 3 4 11 12' }}
        run: |
          if ! [[ "$REQUESTED_YEARS" =~ ^[[:blank:]0-9]+$ && "$REQUESTED_MONTHS" =~ ^[[:blank:]0-9]+$ ]]; then
            echo "::error::Saisir les années et les mois avec des chiffres séparés par des espaces"
            exit 1
          fi
          read -r -a years <<< "$REQUESTED_YEARS"
          read -r -a months <<< "$REQUESTED_MONTHS"
          if (( ${#years[@]} == 0 || ${#months[@]} == 0 )); then
            echo "::error::Au moins une année et un mois sont nécessaires"
            exit 1
          fi
          for year in "${years[@]}"; do
            if ! [[ "$year" =~ ^20(0[3-9]|1[0-9]|2[0-3])$ ]]; then
              echo "::error::Années admises : 2003 à 2023"
              exit 1
            fi
          done
          for i in "${!months[@]}"; do
            if ! [[ "${months[i]}" =~ ^(0?[1-9]|1[0-2])$ ]]; then
              echo "::error::Mois admis : 1 à 12"
              exit 1
            fi
            months[i]="${months[i]#0}"
          done
          printf -v years_json '"%s",' "${years[@]}"
          printf 'years=[%s]\nmonths=%s\n' "${years_json%,}" "${months[*]}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      YEAR: ${{ matrix.year }}
      MONTHS: ${{ needs.plan.outputs.months }}
    strategy:
      max-parallel: 1          # une requête à la fois : EWDS refuse au-delà d'une file par compte (01/11/2026)
      fail-fast: false
      matrix:
        year: ${{ fromJson(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install numpy pandas pyyaml "cdsapi>=0.7.4" xarray cfgrib eccodes
      - name: Release de stockage et mois déjà publiés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Reprévisions GloFAS v4 réduites" \
            --notes "Données de travail de la vérification par l'impact (validation/protocole_verification_impact.md). Copernicus EWDS, GloFAS v4 ; réduites par scripts/build_glofas_reforecast.py." || true
          mkdir -p "data/$COUNTRY/reforecast"
          gh release download "$TAG" --pattern "glofas_v4_${YEAR}_*.npz" --dir "data/$COUNTRY/reforecast" || true
      - name: Télécharger et réduire, mois par mois (publié au fur et à mesure)
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r -a months <<< "$MONTHS"
          for m in "${months[@]}"; do
            python scripts/build_glofas_reforecast.py --country "$COUNTRY" --year "$YEAR" --months "$m" || { echo "::warning::${YEAR}-$m échoué"; continue; }
            f="data/$COUNTRY/reforecast/glofas_v4_${YEAR}_$(printf %02d "$m").npz"
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
