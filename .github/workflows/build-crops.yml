name: 11 - Cultures et bâti exposés aux crues (WorldCover x HAND)

# Croise l'occupation du sol (ESA WorldCover, 10 m) et la HAND pour estimer les cultures et le bâti en zone basse près des cours d'eau.
# À relancer seulement si la hydrologie de terrain ou les limites changent.
on:
  schedule:
    - cron: "0 5 10 1 *"   # le 10 janvier : nouvelle couverture du sol éventuelle
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  crops:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Cultures et bâti exposés
        shell: bash
        run: python scripts/build_crop_exposure.py --country "${{ github.event.inputs.country || 'mdg' }}" 2>&1 | tee data/_crops_log.txt
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f data/_crops_log.txt data/mdg/external/cultures.csv
          git diff --cached --quiet || (git commit -m "Cultures et bâti exposés aux crues (WorldCover x HAND)" && git pull --rebase --autostash origin main && git push)
