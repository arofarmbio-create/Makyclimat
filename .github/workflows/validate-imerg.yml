name: 18 - Intensité IMERG contre cumul (inondations pluviales, périmètre pilote)

# Applique validation/protocole_intensite_imerg.md aux saisons IMERG de la release « imerg-pilote » (workflow 17). Manuel.
on:
  schedule:
    - cron: "0 6 20 9 *"    # le 20 septembre, après l'ajout de la saison passée
  workflow_dispatch:

permissions:
  contents: write

env:
  COUNTRY: mdg

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests shapely
      - name: Saisons IMERG et fiches DesInventar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "data/$COUNTRY/imerg"
          gh release download imerg-pilote --pattern "imerg_*.npz" --dir "data/$COUNTRY/imerg"
          python scripts/connector_desinventar.py --country "$COUNTRY"
      - name: Validation
        run: python scripts/validate_imerg_pluvial.py --country "$COUNTRY"
      - name: Publier
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add validation/intensite_imerg.md validation/intensite_imerg_scores.csv
          git diff --cached --quiet || (git commit -m "Intensité IMERG contre cumul : validation sur le périmètre pilote" && git pull --rebase origin main && git push)
