name: 8 - Prévision saisonnière (ECMWF SEAS5)

# Récupère la prévision saisonnière de pluie par district (Open-Meteo / ECMWF SEAS5) et calcule les probabilités. Une fois par semaine.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  seasonal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Prévision saisonnière
        run: |
          set -o pipefail
          python scripts/connector_seasonal.py --country "${{ github.event.inputs.country || 'mdg' }}" 2>&1 | tee data/_seasonal_log.txt
      - name: Modèle statistique El Niño / dipôle de l'océan Indien par région (validé en LOO et chronologique)
        if: always()
        run: |
          python scripts/connector_enso.py || echo "ONI non mis à jour, fichier existant utilisé"
          python scripts/connector_dmi.py || echo "DMI (ERSST) non mis à jour, fichier existant utilisé"
          python scripts/build_teleconnections.py --country "${{ github.event.inputs.country || 'mdg' }}" || echo "Modèle de téléconnexions indisponible"
      - name: Planification à 12 mois (saison suivante ; signal validé ou scénarios climatologiques)
        if: always()
        run: python scripts/build_planning.py --country "${{ github.event.inputs.country || 'mdg' }}" || echo "Planification indisponible"
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add docs/data data
          git add validation/teleconnexions_regions.csv validation/teleconnexions.md validation/planification_12mois.md validation/planification_12mois_regions.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Prévision saisonnière (ECMWF SEAS5) : écarts et probabilités par district" && git pull --rebase --autostash origin main && git push)
