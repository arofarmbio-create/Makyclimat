name: Vérifier les sources de données
on:
  schedule:
    - cron: "0 2 * * 1"   # chaque lundi : une source déplacée ou fermée est signalée (leçon de la panne CHIRPS du 28/10/2026)
  workflow_dispatch:
permissions:
  contents: write
# Idempotence (10/11/2026) : un lancement identique (même workflow, branche et paramètres) attend la fin du précédent
# au lieu de tourner en parallèle ; des paramètres différents restent indépendants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ join(github.event.inputs.*, '-') }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.5 pandas==2.2.3 numpy==2.2.6 pyyaml==6.0.2 shapely==2.0.7 pdfplumber==0.11.6 geopandas==1.0.1 pyogrio==0.10.0 scipy==1.15.3 rasterio==1.4.3
      - run: python scripts/probe_sources.py
      - name: Enregistrer le résultat
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add data/_probe.txt; git add -f validation 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Résultat du sondage des sources" && git pull --rebase --autostash origin main && git push)
