name: Vérifier les sources de données
on:
  schedule:
    - cron: "0 2 * * 1"   # chaque lundi : une source déplacée ou fermée est signalée (leçon de la panne CHIRPS du 28/10/2026)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy pyyaml shapely pdfplumber geopandas pyogrio scipy rasterio
      - run: python scripts/probe_sources.py
      - name: Enregistrer le résultat
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add data/_probe.txt; git add -f validation 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Résultat du sondage des sources" && git pull --rebase origin main && git push)
