name: 1 - Construire les limites et la population (une seule fois)

# À lancer manuellement UNE fois, puis seulement si les limites administratives changent.
# Se lance aussi automatiquement quand le fichier .github/first-run.txt est modifié (démarrage sans clic).
on:
  push:
    branches: [main]
    paths: [".github/first-run.txt"]
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"
      precise_population:
        description: "Remplacer la population COD-PS (2018) par la grille WorldPop 100 m (plus précis, plus long)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances (cartographie)
        run: pip install -r requirements.txt
      - name: Limites administratives (OCHA COD-AB via HDX)
        run: python scripts/build_boundaries.py --country "${{ github.event.inputs.country || 'mdg' }}"
      - name: Population (OCHA COD-PS via HDX)
        run: python scripts/build_population.py --country "${{ github.event.inputs.country || 'mdg' }}"
      - name: Population précise par fokontany (grille WorldPop 100 m)
        if: ${{ github.event.inputs.precise_population != 'false' }}
        run: |
          python scripts/build_population_grid.py --country "${{ github.event.inputs.country || 'mdg' }}" || echo "Grille indisponible, population COD-PS conservée"
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || (git commit -m "Limites administratives et population" && git pull --rebase origin main && git push)
