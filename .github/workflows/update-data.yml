name: Mise à jour des données et publication

# Automatique : les 3, 13 et 23 de chaque mois (après la fin de chaque dékade CHIRPS).
# Manuel : onglet Actions > « Mise à jour des données et publication » > Run workflow.
on:
  schedule:
    - cron: "0 5 3,13,23 * *"
  # Enchaînement automatique après la normale de pluie (premier démarrage)
  workflow_run:
    workflows: ["2 - Construire la normale de pluie (une seule fois)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays (fichier config/countries/<code>.yml)"
        default: "mdg"

permissions:
  contents: write     # archiver l'instantané des districts
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  COUNTRY: ${{ github.event.inputs.country || 'mdg' }}

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-update.txt
      - name: Installer les dépendances
        run: pip install -r requirements-update.txt
      - name: Mettre à jour la pluie (CHIRPS)
        run: python scripts/update_rainfall.py --country "$COUNTRY"
      - name: Indicateurs ONU/OCHA via HAPI (IPC, pauvreté) — ignoré si le secret est absent
        env:
          HAPI_APP_IDENTIFIER: ${{ secrets.HAPI_APP_IDENTIFIER }}
        run: |
          python scripts/connector_hapi.py --country "$COUNTRY" || echo "HAPI indisponible, indicateurs externes non mis à jour"
      - name: Calculer les indicateurs
        run: python scripts/compute_metrics.py --country "$COUNTRY"
      - name: Générer le catalogue
        run: python scripts/build_catalogue.py --country "$COUNTRY"
      - name: Contrôle qualité (arrête tout si anomalie)
        run: python scripts/validate.py --country "$COUNTRY"
      - name: Archiver l'instantané des districts
        run: |
          python scripts/archive_snapshot.py --country "$COUNTRY"
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add archive
          git diff --cached --quiet || (git commit -m "Archive des indicateurs (données jusqu'à la dernière dékade)" && git pull --rebase origin main && git push)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
