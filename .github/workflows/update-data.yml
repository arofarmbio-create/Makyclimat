name: Mise à jour des données et publication

# Automatique : toutes les 6 heures (prévision météo et débits de rivière) ; les pluies satellites CHIRPS se mettent à jour
# toutes seules à chaque nouvelle dékade.
# Manuel : onglet Actions > « Mise à jour des données et publication » > Run workflow.
on:
  schedule:
    - cron: "10 0,6,12,18 * * *"
  # Enchaînement automatique après la normale de pluie (premier démarrage)
  workflow_run:
    workflows: ["2 - Construire la normale de pluie (une seule fois)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays (fichier config/countries/<code>.yml)"
        default: "mdg"

permissions:
  contents: write     # archiver l'instantané des districts
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  COUNTRY: ${{ github.event.inputs.country || 'mdg' }}

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-update.txt
      - name: Installer les dépendances
        run: pip install -r requirements-update.txt
      - name: Mettre à jour la pluie (CHIRPS)
        run: python scripts/update_rainfall.py --country "$COUNTRY"
      - name: Indicateurs ONU/OCHA via HAPI (IPC, pauvreté) — app_identifier généré automatiquement, ignoré en cas d'indisponibilité
        run: |
          python scripts/connector_hapi.py --country "$COUNTRY" || echo "HAPI indisponible, indicateurs externes non mis à jour"
      - name: Accessibilité aux services et aux routes (HeiGIT via HDX) — ignorée en cas d'indisponibilité
        run: |
          python scripts/connector_heigit.py --country "$COUNTRY" || echo "HeiGIT indisponible, indicateurs d'accessibilité non mis à jour"
      - name: Écoles et formations sanitaires cartographiées (OpenStreetMap) — ignorées en cas d'indisponibilité
        run: |
          python scripts/connector_osm_services.py --country "$COUNTRY" || echo "OpenStreetMap indisponible, comptes de services non mis à jour"
      - name: Formations sanitaires recensées sur mWater Portal (comptage réel, fichier source extrait manuellement)
        run: |
          python scripts/connector_mwater_services.py --country "$COUNTRY" || echo "mWater indisponible, formations sanitaires non mises à jour"
      - name: Santé, eau et assainissement par région (enquête DHS) — ignorés en cas d'indisponibilité
        run: |
          python scripts/connector_dhs.py --country "$COUNTRY" || echo "DHS indisponible, indicateurs de santé non mis à jour"
      - name: État actuel d'El Niño / La Niña (indice ONI)
        run: |
          python scripts/connector_enso.py || echo "ONI indisponible, état ENSO non mis à jour"
      - name: Prévision météo (Open-Meteo) — ignorée en cas d'indisponibilité
        run: |
          python scripts/update_forecast.py --country "$COUNTRY" || echo "Prévision indisponible, alertes précoces non mises à jour"
      - name: Débits de rivière prévus (GloFAS via Open-Meteo) — ignorés en cas d'indisponibilité
        run: |
          python scripts/update_floods.py --country "$COUNTRY" || echo "Débits indisponibles, alertes de crue non mises à jour"
      - name: Susceptibilité aux inondations (modèle validé, sans réseau)
        run: python scripts/build_susceptibility.py --country "$COUNTRY" || echo "Susceptibilité indisponible"
      - name: Chocs cyclone des 12 derniers mois (format JIAF) — ignorés en cas d'indisponibilité
        run: python scripts/build_shocks.py --country "$COUNTRY" --recent || echo "Chocs indisponibles"
      - name: Choc crue (période de retour du débit récent, format JIAF) — ignoré en cas d'indisponibilité
        run: python scripts/build_flood_shock.py --country "$COUNTRY" || echo "Choc crue indisponible"
      - name: Indice de vulnérabilité cumulative (expérimental, non validé) — ignoré en cas d'indisponibilité
        run: python scripts/build_vuln_cumul.py --country "$COUNTRY" || echo "Vulnérabilité cumulative indisponible"
      - name: Prix du riz (WFP/HDX, donnée candidate non affichée) — ignoré en cas d'indisponibilité
        run: |
          python scripts/connector_wfp_prices.py || echo "Prix WFP indisponibles"
          if [ -f validation/wfp_prix_riz_candidat.csv ]; then
            git config user.name "makyclimat-bot"
            git config user.email "makyclimat-bot@users.noreply.github.com"
            git add -f validation/wfp_prix_riz_candidat.csv
            git diff --cached --quiet || (git commit -m "Prix du riz WFP (donnée candidate, non affichée sur le site)" && git pull --rebase origin main && git push)
          fi
      - name: Cartographie de crise Copernicus EMS en quasi temps réel (zones inondées actives) — ignorée en cas d'indisponibilité
        run: python scripts/connector_ems_live.py --country "$COUNTRY" || echo "Cartographie EMS en direct indisponible"
      - name: Calculer les indicateurs
        run: |
          set -o pipefail
          python scripts/compute_metrics.py --country "$COUNTRY" 2>&1 | tee data/_compute_log.txt
      - name: Calendrier cultural (recommandations officielles et fenêtres saisies)
        run: python scripts/build_calendar.py --country "$COUNTRY"
      - name: Générer le catalogue
        run: python scripts/build_catalogue.py --country "$COUNTRY"
      - name: Contrôle qualité (arrête tout si anomalie)
        run: python scripts/validate.py --country "$COUNTRY"
      - name: Archiver l'instantané des districts
        run: |
          python scripts/archive_snapshot.py --country "$COUNTRY"
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add archive
          tail -n 80 data/_compute_log.txt > data/_compute_tail.txt
          git add -f data/_compute_tail.txt
          git diff --cached --quiet || (git commit -m "Archive des indicateurs (données jusqu'à la dernière dékade)" && git pull --rebase origin main && git push)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
