name: 13 - Essai des reprévisions GloFAS (Copernicus EWDS)

# Mesure la taille et la durée d'un mois de reprévisions GloFAS sur Madagascar, avant de télécharger 20 ans. Manuel.
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Année (1999-2023)"
        default: "2018"
      month:
        description: "Mois (1-12)"
        default: "1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install "cdsapi>=0.7.4" xarray cfgrib eccodes
      - name: Télécharger et lire un mois de reprévisions
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: python scripts/probe_glofas_reforecast.py --year "${{ github.event.inputs.year }}" --month "${{ github.event.inputs.month }}"
