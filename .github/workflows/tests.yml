name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install numpy pandas pyyaml requests geopandas pyogrio shapely rasterio scipy
      - run: npm install --no-save jsdom
      - name: Données simulées et tests de la chaîne de données
        run: |
          python tests/make_synthetic.py
          python scripts/build_catalogue.py --country demo
          python tests/test_pipeline.py
          python tests/test_connectors.py
          python tests/test_climate.py
          python tests/test_hydro.py
          python tests/test_history.py
          python tests/make_synthetic.py
          python tests/test_hydro_build.py
          python tests/test_cyclones.py
          python tests/test_seasonal.py
          python tests/test_calendar.py
          python tests/test_validate_events.py
          python tests/test_susceptibility.py
          python tests/test_soilwater.py
          python tests/test_soilwater_build.py
          python scripts/compute_metrics.py --country demo
      - name: Tests de l'interface
        run: node tests/ui_test.js demo
