name: "26 - Grilles SPI-3 et SPI-12 des 48 derniers mois (phase 1 eaux souterraines)"

# Protocole validation/protocole_cadre_eaux_souterraines.md, phase 1. Réutilise le cache de pluie hors saison du
# workflow 6 (aucun retéléchargement massif de CHIRPS). La grille va dans la release « spi-grilles ». Manuel, et le
# 26 de chaque mois pour suivre les nouveaux relevés.
on:
  schedule:
    - cron: "10 5 26 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  COUNTRY: mdg
  TAG: spi-grilles

# Idempotence (10/11/2026) : un lancement identique (même workflow, branche et paramètres) attend la fin du précédent
# au lieu de tourner en parallèle ; des paramètres différents restent indépendants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ join(github.event.inputs.*, '-') }}
  cancel-in-progress: false

jobs:
  spi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Cache de la pluie mensuelle hors saison (workflow 6)
        uses: actions/cache/restore@v4
        with:
          path: data/mdg/grids/rain_offseason.npz
          key: pluie-hors-saison-absent
          restore-keys: pluie-hors-saison-
      - name: Grilles SPI
        run: python scripts/build_spi_grilles.py --country "$COUNTRY"
      - name: Publier dans la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Grilles SPI-3 et SPI-12 (48 derniers mois)" \
            --notes "CHIRPS v2.0, SPI de production (soilwater_core.spi). scripts/build_spi_grilles.py." || true
          gh release upload "$TAG" data/$COUNTRY/grids/spi_grilles.npz --clobber
