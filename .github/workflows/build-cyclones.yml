name: 7 - Cyclones passés (IBTrACS)

# Télécharge les trajectoires IBTrACS (océan Indien Sud) et calcule l'exposition historique par zone. Une fois par semaine.
on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  cyclones:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Trajectoires et exposition aux cyclones
        run: python scripts/build_cyclones.py --country "${{ github.event.inputs.country || 'mdg' }}"
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || (git commit -m "Cyclones passés (IBTrACS) : trajectoires et exposition" && git pull --rebase origin main && git push)
