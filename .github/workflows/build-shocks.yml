name: 12 - Indicateurs de choc (format JIAF)

# Intensité, proximité et pluie locale de chaque cyclone documenté, par fokontany (vent IBTrACS, pluie CHIRPS).
on:
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  shocks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Calcul
        shell: bash
        run: python scripts/build_shocks.py --country "${{ github.event.inputs.country || 'mdg' }}" 2>&1 | tee validation/_journal_chocs.txt
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f validation
          git diff --cached --quiet || (git commit -m "Indicateurs de choc JIAF : cyclones passés par fokontany" && git pull --rebase origin main && git push)
