name: 10 - Validation du modèle de crue (périmètre pilote)

# Confronte le débit simulé GloFAS et les seuils de crue aux inondations documentées (validation/evenements.csv) et aux
# communes inondées cartographiées par Copernicus EMS. Manuel ; résultat dans validation/crues_validation.md.
on:
  schedule:
    - cron: "0 7 4 1,4,7,10 *"   # tous les trimestres
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  floods:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: "Événements indépendants de GloFAS (GDACS : cyclones, inondations DFO/JRC)"
        run: python scripts/connector_gdacs_events.py || echo "GDACS indisponible, liste existante utilisée"
      - name: Validation du modèle de crue
        run: python -u scripts/validate_floods.py --country "${{ github.event.inputs.country || 'mdg' }}"
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f validation/crues_validation.md validation/crues_episodes.csv validation/evenements_gdacs.csv data/*/grids/glofas_windows.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Validation du modèle de crue (périmètre pilote)" && git pull --rebase origin main && git push)
