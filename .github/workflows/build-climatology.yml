name: 2 - Construire la normale de pluie (une seule fois)

# À lancer manuellement UNE fois. Télécharge environ 360 fichiers CHIRPS (10 à 20 minutes).
on:
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  climatology:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements-update.txt
      - name: Calculer la normale mensuelle 1991-2020
        run: python scripts/build_climatology.py --country "${{ github.event.inputs.country }}"
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Normale mensuelle de pluie" && git push)
