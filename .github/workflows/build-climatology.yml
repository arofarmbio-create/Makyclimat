name: 2 - Construire la normale de pluie (une seule fois)

# À lancer manuellement UNE fois (puis à refaire chaque année après la saison). Télécharge environ 650 fichiers CHIRPS.
# Enchaînement automatique après la construction des limites (premier démarrage).
on:
  workflow_run:
    workflows: ["1 - Construire les limites et la population (une seule fois)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  climatology:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements-update.txt
      - name: Calculer la normale mensuelle 1991-2020
        run: python scripts/build_climatology.py --country "${{ github.event.inputs.country || 'mdg' }}"
      - name: Indice ENSO (El Niño / La Niña, NOAA)
        run: python scripts/connector_enso.py
      - name: Changement climatique et ENSO (pluie saisonnière depuis 1981, tendances, phases)
        run: python scripts/build_climate_change.py --country "${{ github.event.inputs.country || 'mdg' }}"
      - name: Fiabilité mesurée des scénarios (validation croisée sur toutes les saisons)
        run: python scripts/build_hindcast.py --country "${{ github.event.inputs.country || 'mdg' }}"
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || (git commit -m "Normale mensuelle de pluie" && git pull --rebase --autostash origin main && git push)
