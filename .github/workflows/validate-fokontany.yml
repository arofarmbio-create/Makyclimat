name: 10 - Validation fokontany (Copernicus EMS)

# Compare nos indicateurs aux dégâts cartographiés par satellite (Copernicus EMS) au niveau fokontany puis commune.
on:
  workflow_dispatch:
    inputs:
      country:
        description: "Code du pays"
        default: "mdg"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt geopandas pyogrio
      - name: Validation fokontany
        shell: bash
        run: python scripts/validate_fokontany.py --country "${{ github.event.inputs.country || 'mdg' }}" 2>&1 | tee validation/_journal_ems.txt
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add -f validation
          git diff --cached --quiet || (git commit -m "Validation fokontany (Copernicus EMS) : résultats" && git pull --rebase origin main && git push)
