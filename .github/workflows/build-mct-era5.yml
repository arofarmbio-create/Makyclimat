name: "22 - Indice du canal de Mozambique (ERA5 850 hPa, protocole H-N7)"

# Tourbillon relatif et vent à 850 hPa sur le canal de Mozambique (30-50°E, 30-10°S), moyennes mensuelles de décembre,
# janvier et février depuis 1981 (ERA5, Copernicus). Une seule demande ; à lancer quand aucune autre demande Copernicus
# du compte n'est en cours (règle des téléchargements du 02/11/2026). Chaque année en mars, février étant publié.
on:
  schedule:
    - cron: "0 6 12 3 *"
  workflow_dispatch:

permissions:
  contents: write

# Idempotence (10/11/2026) : un lancement identique (même workflow, branche et paramètres) attend la fin du précédent
# au lieu de tourner en parallèle ; des paramètres différents restent indépendants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ join(github.event.inputs.*, '-') }}
  cancel-in-progress: false

jobs:
  mct:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # la demande peut attendre plus de 4 h dans la file Copernicus (03/11/2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.2.6 pandas==2.2.3 pyyaml==6.0.2 requests==2.32.5 cdsapi==0.7.7 xarray==2025.6.1 netCDF4==1.7.2 h5netcdf==1.6.1
      - name: Indice ERA5 (après ménage de la file Copernicus du compte)
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          python scripts/cds_menage.py --age-min 30 || true
          python scripts/build_mct_era5.py
      - name: Publier
        run: |
          git config user.name "makyclimat-bot"
          git config user.email "makyclimat-bot@users.noreply.github.com"
          git add data/enso/mct_era5.csv
          git diff --cached --quiet || (git commit -m "Indice du canal de Mozambique (ERA5 850 hPa)" && git pull --rebase --autostash origin main && git push)
